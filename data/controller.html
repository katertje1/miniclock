<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock Control Interface</title>
  <style>
    /* General page styling */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #444;
      text-align: center;
      margin-bottom: 40px;
    }

    /* Select Dropdown styling */
    label {
      font-weight: bold;
      margin-right: 10px;
    }

    select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      margin-bottom: 20px;
      background-color: #fff;
    }

    /* Button styling */
    button {
      background-color: #5c6bc0;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px 0;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3f51b5;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #5c6bc0;
      color: white;
    }

    th a {
      color: white;
      text-decoration: none;
    }

    th a:hover {
      text-decoration: underline;
    }

    /* Zebra striping for table rows */
    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tbody tr:hover {
      background-color: #f1f1f1;
    }

    /* Colors for clock info cells */
    td {
      color: #555;
    }

    #clockTime, #clockDate {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    /* Styling for color blocks */
    td[id^="hourColor"], td[id^="minuteColor"] {
      color: #fff;
      font-weight: bold;
    }

    /* Section headers styling */
    h2 {
      font-size: 1.5rem;
      color: #444;
      margin-bottom: 15px;
      text-align: center;
    }

    /* Responsive design for mobile screens */
    @media (max-width: 768px) {
      th, td {
        padding: 10px;
        font-size: 0.9rem;
      }

      button {
        font-size: 0.9rem;
        padding: 8px 16px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <h1>Control Clocks</h1>
  <div style="text-align: center;">
    <label for="targetClock">Select Clock:</label>
    <select id="targetClock">
    </select>
  </div>

  <div id="clockTime"></div>
  <div id="clockDate"></div>

  <div id="sections">
    <div id="section-modes">
      <h2>Modes</h2>
      <div style="text-align: center;">
        <button onclick="setMode('Clock')">Set Clock Mode</button>
        <button onclick="setMode('Love')">Set Love Mode</button>
        <button onclick="setMode('Food')">Set Food Mode</button>
        <button onclick="setMode('Rainbow')">Set Rainbow Mode</button>
      </div>
    </div>
  </div>

  <table>
    <thead id="clockTableHead"></thead>
    <tbody id="clockTableBody"></tbody>
  </table>

  <!-- Move JavaScript here to ensure DOM is loaded -->
  <script>
    let clockNames = [];
    let clockHosts = [];

    function displayName(name) {
      return name.replace(/_/g, ' ');
    }

    function buildSelect() {
      const select = document.getElementById('targetClock');
      select.innerHTML = '';
      const allOpt = document.createElement('option');
      allOpt.value = 'all';
      allOpt.textContent = 'All Clocks';
      select.appendChild(allOpt);
      clockHosts.forEach((host, index) => {
        const opt = document.createElement('option');
        opt.value = host;
        opt.textContent = displayName(clockNames[index]);
        select.appendChild(opt);
      });
    }

    function buildTable() {
      const thead = document.getElementById('clockTableHead');
      const tbody = document.getElementById('clockTableBody');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      const headerRow = document.createElement('tr');
      clockHosts.forEach((host, index) => {
        const th = document.createElement('th');
        const a = document.createElement('a');
        a.href = `http://${host}`;
        a.target = '_blank';
        a.id = `deviceName-${index}`;
        a.textContent = displayName(clockNames[index]);
        th.appendChild(a);
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      const rows = [
        'softwareVersion',
        'currentTime',
        'sunriseTime',
        'sunsetTime',
        'currentMode',
        'currentBrightness',
        'hourColor',
        'minuteColor'
      ];

      rows.forEach(rowId => {
        const tr = document.createElement('tr');
        clockHosts.forEach((_, index) => {
          const td = document.createElement('td');
          td.id = `${rowId}-${index}`;
          if (rowId === 'hourColor' || rowId === 'minuteColor') {
            td.style.width = '50px';
            td.style.height = '20px';
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function sendCommand(command, target) {
      const targets = target === 'all' ? clockHosts : [target];
      targets.forEach(host => {
        fetch(`http://${host}/${command}`)
          .then(response => response.text())
          .then(data => console.log(`Response from ${host}: ${data}`))
          .catch(error => console.error(`Error with ${host}: ${error}`));
      });
    }

    function setMode(mode) {
      const target = document.getElementById('targetClock').value;
      sendCommand(`set${mode}Mode`, target);
    }

    function fetchClockData(host) {
      const requests = [
        fetch(`http://${host}/getDeviceName`).then(response => response.text()),
        fetch(`http://${host}/getSoftwareVersion`).then(response => response.text()),
        fetch(`http://${host}/getCurrentDateTime`).then(response => response.text()),
        fetch(`http://${host}/getSunrise`).then(response => response.text()),
        fetch(`http://${host}/getSunset`).then(response => response.text()),
        fetch(`http://${host}/getCurrentMode`).then(response => response.text()),
        fetch(`http://${host}/getBrightness`).then(response => response.json()),
        fetch(`http://${host}/getHourColor`).then(response => response.text().then(color => color.trim())),
        fetch(`http://${host}/getMinuteColor`).then(response => response.text().then(color => color.trim()))
      ];

      return Promise.all(requests)
        .then(responses => ({
          deviceName: responses[0],
          softwareVersion: responses[1],
          currentTime: responses[2],
          sunriseTime: responses[3],
          sunsetTime: responses[4],
          currentMode: responses[5],
          currentBrightness: responses[6].brightness,
          hourColor: responses[7],
          minuteColor: responses[8]
        }))
        .catch(error => {
          console.error(`Error fetching data from ${host}:`, error);
          return null;
        });
    }

    function updateTable() {
      clockHosts.forEach((host, index) => {
        fetchClockData(host).then(data => {
          if (data) {
            document.getElementById(`deviceName-${index}`).innerText = data.deviceName;
            document.getElementById(`softwareVersion-${index}`).innerText = data.softwareVersion;
            document.getElementById(`currentTime-${index}`).innerText = data.currentTime;
            document.getElementById(`sunriseTime-${index}`).innerText = data.sunriseTime;
            document.getElementById(`sunsetTime-${index}`).innerText = data.sunsetTime;
            document.getElementById(`currentMode-${index}`).innerText = data.currentMode;
            document.getElementById(`currentBrightness-${index}`).innerText = data.currentBrightness;

            const hourColorElem = document.getElementById(`hourColor-${index}`);
            const minuteColorElem = document.getElementById(`minuteColor-${index}`);

            hourColorElem.style.backgroundColor = data.hourColor.startsWith('#') ? data.hourColor : `#${data.hourColor}`;
            hourColorElem.style.color = 'black';
            hourColorElem.innerText = data.hourColor;

            minuteColorElem.style.backgroundColor = data.minuteColor.startsWith('#') ? data.minuteColor : `#${data.minuteColor}`;
            minuteColorElem.style.color = 'black';
            minuteColorElem.innerText = data.minuteColor;
          }
        });
      });
    }

    function updateDebugTablePeriodically() {
      setInterval(() => {
        updateTable();  // Call the function to update the table every 10 seconds
      }, 10000);  // Every 10 seconds
    }

    function loadClockList() {
      fetch('/getClockList')
        .then(response => response.json())
        .then(names => {
          clockNames = names;
          clockHosts = names.map(n => `${n}.local`);
          buildSelect();
          buildTable();
          updateTable();
          updateDebugTablePeriodically();
        })
        .catch(error => console.error('Error loading clock list:', error));
    }

    window.onload = function () {
      loadClockList();
    }
  </script>
</body>

</html>
