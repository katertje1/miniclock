<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock Control Interface</title>
  <style>
    /* General page styling */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #444;
      text-align: center;
      margin-bottom: 40px;
    }

    /* Select Dropdown styling */
    label {
      font-weight: bold;
      margin-right: 10px;
    }

    select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      margin-bottom: 20px;
      background-color: #fff;
    }

    /* Button styling */
    button {
      background-color: #5c6bc0;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px 0;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3f51b5;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #5c6bc0;
      color: white;
    }

    th a {
      color: white;
      text-decoration: none;
    }

    th a:hover {
      text-decoration: underline;
    }

    /* Zebra striping for table rows */
    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tbody tr:hover {
      background-color: #f1f1f1;
    }

    /* Colors for clock info cells */
    td {
      color: #555;
    }

    #clockTime, #clockDate {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    /* Styling for color blocks */
    td[id^="hourColor"], td[id^="minuteColor"] {
      color: #fff;
      font-weight: bold;
    }
    td.diag-good {
      background-color: #c8e6c9;
      color: #1b5e20;
      font-weight: bold;
    }
    td.diag-bad {
      background-color: #ffcdd2;
      color: #b71c1c;
      font-weight: bold;
    }
    td.diag-unknown {
      background-color: #eceff1;
      color: #37474f;
      font-weight: bold;
    }

    /* Section headers styling */
    h2 {
      font-size: 1.5rem;
      color: #444;
      margin-bottom: 15px;
      text-align: center;
    }

    /* Responsive design for mobile screens */
    @media (max-width: 768px) {
      th, td {
        padding: 10px;
        font-size: 0.9rem;
      }

      button {
        font-size: 0.9rem;
        padding: 8px 16px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <h1>Control Clocks</h1>
  <div style="text-align: center;">
    <label for="targetClock">Select Clock:</label>
    <select id="targetClock">
    </select>
    <button type="button" onclick="toggleProbeInfo()">Show Probe Targets</button>
  </div>
  <div id="probeInfo" style="display: none; max-width: 900px; margin: 10px auto; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px;">
    <pre id="probeInfoText" style="margin: 0; white-space: pre-wrap; text-align: left; font-size: 0.85rem;"></pre>
  </div>

  <div id="clockTime"></div>
  <div id="clockDate"></div>

  <div id="sections">
    <div id="section-modes">
      <h2>Modes</h2>
      <div style="text-align: center;">
        <button onclick="setMode('Clock')">Set Clock Mode</button>
        <button onclick="setMode('Stopwatch')">Set Stopwatch Mode</button>
        <button onclick="setMode('Love')">Set Love Mode</button>
        <button onclick="setMode('Food')">Set Food Mode</button>
        <button onclick="setMode('Rainbow')">Set Rainbow Mode</button>
      </div>
    </div>
    <div id="section-stopwatch" style="display: none;">
      <h2>Stopwatch</h2>
      <div style="text-align: center;">
        <button onclick="sendNamedCommand('startStopwatch')">Start</button>
        <button onclick="sendNamedCommand('stopStopwatch')">Stop</button>
        <button onclick="sendNamedCommand('resetStopwatch')">Reset</button>
        <button onclick="sendNamedCommand('addStopwatchMinute')">Add 1 minute</button>
      </div>
    </div>
  </div>

  <table>
    <thead id="clockTableHead"></thead>
    <tbody id="clockTableBody"></tbody>
  </table>
  <p id="noClocksMessage" style="display: none; text-align: center; margin-top: 20px;">No reachable clocks found.</p>

  <!-- Move JavaScript here to ensure DOM is loaded -->
  <script>
    let clockNames = [];
    let clockHosts = [];
    let probeStates = [];
    let statusByHost = {};

    function displayName(name) {
      return name.replace(/[_-]/g, ' ');
    }

    function toMdnsHost(name) {
      // Keep display names separate; match current device hostnames (with underscores).
      const safe = name
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9_-]+/g, '_')
        .replace(/_+/g, '_')
        .replace(/-+/g, '-')
        .replace(/^[-_]|[-_]$/g, '')
        .toLowerCase();
      return `${safe}.local`;
    }

    function buildSelect(reachableHosts, reachableNames) {
      const select = document.getElementById('targetClock');
      select.innerHTML = '';
      const selfHost = (window.location.hostname || '').toLowerCase();
      const allOpt = document.createElement('option');
      allOpt.value = 'all';
      allOpt.textContent = 'All Clocks';
      select.appendChild(allOpt);
      reachableHosts.forEach((host, index) => {
        const opt = document.createElement('option');
        opt.value = host;
        opt.textContent = displayName(reachableNames[index]);
        select.appendChild(opt);
      });

      if (selfHost && reachableHosts.includes(selfHost)) {
        select.value = selfHost;
      } else {
        select.value = 'all';
      }
    }

    function buildTable(reachableHosts, reachableNames) {
      const thead = document.getElementById('clockTableHead');
      const tbody = document.getElementById('clockTableBody');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      const headerRow = document.createElement('tr');
      reachableHosts.forEach((host, index) => {
        const th = document.createElement('th');
        const a = document.createElement('a');
        a.href = `http://${host}`;
        a.target = '_blank';
        a.id = `deviceName-${index}`;
        a.textContent = displayName(reachableNames[index]);
        th.appendChild(a);
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      const rows = [
        'softwareVersion',
        'currentTime',
        'sunriseTime',
        'sunsetTime',
        'diagnostics',
        'currentMode',
        'currentBrightness',
        'hourColor',
        'minuteColor'
      ];

      rows.forEach(rowId => {
        const tr = document.createElement('tr');
        reachableHosts.forEach((_, index) => {
          const td = document.createElement('td');
          td.id = `${rowId}-${index}`;
          if (rowId === 'hourColor' || rowId === 'minuteColor') {
            td.style.width = '50px';
            td.style.height = '20px';
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function sendCommand(command, target) {
      const targets = target === 'all' ? clockHosts : [target];
      targets.forEach(host => {
        fetch(`http://${host}/${command}`)
          .then(response => response.text())
          .then(data => console.log(`Response from ${host}: ${data}`))
          .catch(error => console.error(`Error with ${host}: ${error}`));
      });
    }

    function setMode(mode) {
      const target = document.getElementById('targetClock').value;
      sendCommand(`set${mode}Mode`, target);
    }

    function sendNamedCommand(command) {
      const target = document.getElementById('targetClock').value;
      sendCommand(command, target);
    }

    function refreshStopwatchVisibility() {
      const section = document.getElementById('section-stopwatch');
      const target = document.getElementById('targetClock').value;
      if (target === 'all') {
        section.style.display = 'none';
        return;
      }
      const status = statusByHost[target];
      const mode = status && status.currentMode ? status.currentMode : '';
      section.style.display = mode === 'Stopwatch Mode' ? 'block' : 'none';
    }

    function fetchClockData(host) {
      const statusReq = fetch(`http://${host}/getStatus`).then(response => response.json());
      const diagReq = fetch(`http://${host}/getDiagnostics`)
        .then(response => response.json())
        .catch(() => null);

      return Promise.all([statusReq, diagReq])
        .then(([statusData, diagnostics]) => {
          if (!statusData) return null;
          statusData.diagnostics = diagnostics;
          return statusData;
        })
        .catch(error => {
          console.error(`Error fetching data from ${host}:`, error);
          return null;
        });
    }

    function classifyDiagnostics(diag) {
      if (!diag || !diag.resetReason) {
        return { text: "Unknown", cls: "diag-unknown", title: "No diagnostics data" };
      }
      const reason = String(diag.resetReason || "");
      const info = String(diag.resetInfo || "");
      const combined = `${reason} ${info}`.toLowerCase();
      const badSignals = ["exception", "fatal", "wdt", "watchdog", "abort", "panic", "crash"];
      const hasCrashSignal = badSignals.some(s => combined.includes(s));
      if (hasCrashSignal) {
        return { text: "Crash", cls: "diag-bad", title: `${reason} | ${info}` };
      }
      if (reason.includes("Software/System restart")) {
        return { text: "Software/System restart", cls: "diag-good", title: `${reason} | ${info}` };
      }
      return { text: "OK", cls: "diag-good", title: `${reason} | ${info}` };
    }

    function updateTable(reachableHosts) {
      reachableHosts.forEach((host, index) => {
        fetchClockData(host).then(data => {
          if (data) {
            statusByHost[host] = data;
            document.getElementById(`deviceName-${index}`).innerText = data.deviceName;
            document.getElementById(`softwareVersion-${index}`).innerText = data.softwareVersion;
            document.getElementById(`currentTime-${index}`).innerText = data.currentTime;
            document.getElementById(`sunriseTime-${index}`).innerText = data.sunriseTime;
            document.getElementById(`sunsetTime-${index}`).innerText = data.sunsetTime;
            const diagElem = document.getElementById(`diagnostics-${index}`);
            const diag = classifyDiagnostics(data.diagnostics);
            diagElem.innerText = diag.text;
            diagElem.classList.remove("diag-good", "diag-bad", "diag-unknown");
            diagElem.classList.add(diag.cls);
            diagElem.title = diag.title;
            document.getElementById(`currentMode-${index}`).innerText = data.currentMode;
            document.getElementById(`currentBrightness-${index}`).innerText = data.currentBrightness;

            const hourColorElem = document.getElementById(`hourColor-${index}`);
            const minuteColorElem = document.getElementById(`minuteColor-${index}`);

            hourColorElem.style.backgroundColor = data.hourColor.startsWith('#') ? data.hourColor : `#${data.hourColor}`;
            hourColorElem.style.color = 'black';
            hourColorElem.innerText = data.hourColor;

            minuteColorElem.style.backgroundColor = data.minuteColor.startsWith('#') ? data.minuteColor : `#${data.minuteColor}`;
            minuteColorElem.style.color = 'black';
            minuteColorElem.innerText = data.minuteColor;

            const selectedTarget = document.getElementById('targetClock').value;
            if (selectedTarget === host) {
              refreshStopwatchVisibility();
            }
          }
        });
      });
    }

    function updateDebugTablePeriodically() {
      setInterval(() => {
        updateTable(clockHosts);  // Call the function to update the table every 10 seconds
      }, 10000);  // Every 10 seconds
    }

    function withTimeout(ms) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      return { signal: controller.signal, cancel: () => clearTimeout(timer) };
    }

    function probeHost(host) {
      const t = withTimeout(2000);
      return fetch(`http://${host}/getDeviceName`, { signal: t.signal })
        .then(res => {
          t.cancel();
          return res.ok;
        })
        .catch(() => false);
    }

    function loadClockList() {
      fetch('/getClockList')
        .then(response => response.json())
        .then(names => {
          const configuredNames = names.slice();
          const configuredHosts = names.map(n => toMdnsHost(n));
          const selfHost = (window.location.hostname || '').toLowerCase();

          Promise.all(configuredHosts.map(probeHost)).then(results => {
            const reachableNames = [];
            const reachableHosts = [];
            probeStates = [];
            results.forEach((ok, idx) => {
              probeStates.push({ name: configuredNames[idx], host: configuredHosts[idx], reachable: ok });
              if (ok) {
                reachableNames.push(configuredNames[idx]);
                reachableHosts.push(configuredHosts[idx]);
              }
            });

            // Always include the current host as reachable: page is already loaded from it.
            if (selfHost && !reachableHosts.includes(selfHost)) {
              const selfIdx = configuredHosts.indexOf(selfHost);
              const selfName = selfIdx >= 0 ? configuredNames[selfIdx] : 'Current_Clock';
              probeStates.unshift({ name: selfName, host: selfHost, reachable: true });
              reachableNames.unshift(selfName);
              reachableHosts.unshift(selfHost);
            } else if (selfHost) {
              const idx = probeStates.findIndex(p => p.host === selfHost);
              if (idx >= 0) {
                probeStates[idx].reachable = true;
              }
            }

            clockNames = reachableNames;
            clockHosts = reachableHosts;
            const noClocks = clockHosts.length === 0;
            document.getElementById('noClocksMessage').style.display = noClocks ? 'block' : 'none';
            document.querySelectorAll('#sections button').forEach(btn => {
              btn.disabled = noClocks;
            });
            buildSelect(clockHosts, clockNames);
            document.getElementById('targetClock').addEventListener('change', refreshStopwatchVisibility);
            buildTable(clockHosts, clockNames);
            updateTable(clockHosts);
            updateDebugTablePeriodically();
            refreshStopwatchVisibility();
          });
        })
        .catch(error => console.error('Error loading clock list:', error));
    }

    function toggleProbeInfo() {
      const panel = document.getElementById('probeInfo');
      const text = document.getElementById('probeInfoText');
      const currentlyHidden = panel.style.display === 'none';
      if (currentlyHidden) {
        if (!probeStates.length) {
          text.textContent = 'No probe data yet.';
        } else {
          text.textContent = probeStates
            .map(p => `${p.reachable ? '[OK] ' : '[--] '} ${p.name} -> ${p.host}`)
            .join('\n');
        }
        panel.style.display = 'block';
      } else {
        panel.style.display = 'none';
      }
    }

    window.onload = function () {
      loadClockList();
    }
  </script>
</body>

</html>
