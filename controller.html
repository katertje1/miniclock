<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock Control Interface</title>
  <style>
    /* General page styling */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #444;
      text-align: center;
      margin-bottom: 40px;
    }

    /* Select Dropdown styling */
    label {
      font-weight: bold;
      margin-right: 10px;
    }

    select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      margin-bottom: 20px;
      background-color: #fff;
    }

    /* Button styling */
    button {
      background-color: #5c6bc0;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px 0;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3f51b5;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #5c6bc0;
      color: white;
    }

    th a {
      color: white;
      text-decoration: none;
    }

    th a:hover {
      text-decoration: underline;
    }

    /* Zebra striping for table rows */
    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tbody tr:hover {
      background-color: #f1f1f1;
    }

    /* Colors for clock info cells */
    td {
      color: #555;
    }

    #clockTime, #clockDate {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    /* Styling for color blocks */
    td[id^="hourColor"], td[id^="minuteColor"] {
      color: #fff;
      font-weight: bold;
    }

    /* Section headers styling */
    h2 {
      font-size: 1.5rem;
      color: #444;
      margin-bottom: 15px;
      text-align: center;
    }

    /* Responsive design for mobile screens */
    @media (max-width: 768px) {
      th, td {
        padding: 10px;
        font-size: 0.9rem;
      }

      button {
        font-size: 0.9rem;
        padding: 8px 16px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <h1>Control Clocks</h1>
  <div style="text-align: center;">
    <label for="targetClock">Select Clock:</label>
    <select id="targetClock">
      <option value="all">All Clocks</option>
      <option value="192.168.1.201">Clock beneden</option>
      <option value="192.168.1.202">Clock Irene</option>
      <option value="192.168.1.203">Clock Jonas</option>
      <option value="192.168.1.204">Clock Alice</option>
      <option value="192.168.1.205">Clock Loïse</option>
    </select>
  </div>

  <div id="clockTime"></div>
  <div id="clockDate"></div>

  <div id="sections">
    <div id="section-modes">
      <h2>Modes</h2>
      <div style="text-align: center;">
        <button onclick="setMode('Clock')">Set Clock Mode</button>
        <button onclick="setMode('Love')">Set Love Mode</button>
        <button onclick="setMode('Food')">Set Food Mode</button>
        <button onclick="setMode('Rainbow')">Set Rainbow Mode</button>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th><a href="http://192.168.1.201" target="_blank" id="deviceName-0">Clock beneden</a></th>
        <th><a href="http://192.168.1.202" target="_blank" id="deviceName-1">Clock Irene</a></th>
        <th><a href="http://192.168.1.203" target="_blank" id="deviceName-2">Clock Jonas</a></th>
        <th><a href="http://192.168.1.204" target="_blank" id="deviceName-3">Clock Alice</a></th>
        <th><a href="http://192.168.1.205" target="_blank" id="deviceName-4">Clock Loïse</a></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td id="softwareVersion-0"></td>
        <td id="softwareVersion-1"></td>
        <td id="softwareVersion-2"></td>
        <td id="softwareVersion-3"></td>
        <td id="softwareVersion-4"></td>
      </tr>
      <tr>
        <td id="currentTime-0"></td>
        <td id="currentTime-1"></td>
        <td id="currentTime-2"></td>
        <td id="currentTime-3"></td>
        <td id="currentTime-4"></td>
      </tr>
      <tr>
        <td id="sunriseTime-0"></td>
        <td id="sunriseTime-1"></td>
        <td id="sunriseTime-2"></td>
        <td id="sunriseTime-3"></td>
        <td id="sunriseTime-4"></td>
      </tr>
      <tr>
        <td id="sunsetTime-0"></td>
        <td id="sunsetTime-1"></td>
        <td id="sunsetTime-2"></td>
        <td id="sunsetTime-3"></td>
        <td id="sunsetTime-4"></td>
      </tr>
      <tr>
        <td id="currentMode-0"></td>
        <td id="currentMode-1"></td>
        <td id="currentMode-2"></td>
        <td id="currentMode-3"></td>
        <td id="currentMode-4"></td>
      </tr>
      <tr>
        <td id="currentBrightness-0"></td>
        <td id="currentBrightness-1"></td>
        <td id="currentBrightness-2"></td>
        <td id="currentBrightness-3"></td>
        <td id="currentBrightness-4"></td>
      </tr>
      <tr>
        <td id="hourColor-0" style="width: 50px; height: 20px;"></td>
        <td id="hourColor-1" style="width: 50px; height: 20px;"></td>
        <td id="hourColor-2" style="width: 50px; height: 20px;"></td>
        <td id="hourColor-3" style="width: 50px; height: 20px;"></td>
        <td id="hourColor-4" style="width: 50px; height: 20px;"></td>
      </tr>
      <tr>
        <td id="minuteColor-0" style="width: 50px; height: 20px;"></td>
        <td id="minuteColor-1" style="width: 50px; height: 20px;"></td>
        <td id="minuteColor-2" style="width: 50px; height: 20px;"></td>
        <td id="minuteColor-3" style="width: 50px; height: 20px;"></td>
        <td id="minuteColor-4" style="width: 50px; height: 20px;"></td>
      </tr>
    </tbody>
  </table>

  <!-- Move JavaScript here to ensure DOM is loaded -->
  <script>
    const clockIPs = [
      '192.168.1.201',
      '192.168.1.202',
      '192.168.1.203',
      '192.168.1.204',
      '192.168.1.205'
    ];

    function sendCommand(command, target) {
      const targets = target === 'all' ? clockIPs : [target];
      targets.forEach(ip => {
        fetch(`http://${ip}/${command}`)
          .then(response => response.text())
          .then(data => console.log(`Response from ${ip}: ${data}`))
          .catch(error => console.error(`Error with ${ip}: ${error}`));
      });
    }

    function setMode(mode) {
      const target = document.getElementById('targetClock').value;
      sendCommand(`set${mode}Mode`, target);
    }

    function fetchClockData(ip) {
      const requests = [
        fetch(`http://${ip}/getDeviceName`).then(response => response.text()),
        fetch(`http://${ip}/getSoftwareVersion`).then(response => response.text()),
        fetch(`http://${ip}/getCurrentDateTime`).then(response => response.text()),
        fetch(`http://${ip}/getSunrise`).then(response => response.text()),
        fetch(`http://${ip}/getSunset`).then(response => response.text()),
        fetch(`http://${ip}/getCurrentMode`).then(response => response.text()),
        fetch(`http://${ip}/getBrightness`).then(response => response.json()),
        fetch(`http://${ip}/getHourColor`).then(response => response.text().then(color => color.trim())),
        fetch(`http://${ip}/getMinuteColor`).then(response => response.text().then(color => color.trim()))
      ];

      return Promise.all(requests)
        .then(responses => ({
          deviceName: responses[0],
          softwareVersion: responses[1],
          currentTime: responses[2],
          sunriseTime: responses[3],
          sunsetTime: responses[4],
          currentMode: responses[5],
          currentBrightness: responses[6].brightness,
          hourColor: responses[7],
          minuteColor: responses[8]
        }))
        .catch(error => {
          console.error(`Error fetching data from ${ip}:`, error);
          return null;
        });
    }

    function updateTable() {
      clockIPs.forEach((ip, index) => {
        fetchClockData(ip).then(data => {
          if (data) {
            document.getElementById(`deviceName-${index}`).innerText = data.deviceName;
            document.getElementById(`softwareVersion-${index}`).innerText = data.softwareVersion;
            document.getElementById(`currentTime-${index}`).innerText = data.currentTime;
            document.getElementById(`sunriseTime-${index}`).innerText = data.sunriseTime;
            document.getElementById(`sunsetTime-${index}`).innerText = data.sunsetTime;
            document.getElementById(`currentMode-${index}`).innerText = data.currentMode;
            document.getElementById(`currentBrightness-${index}`).innerText = data.currentBrightness;

            const hourColorElem = document.getElementById(`hourColor-${index}`);
            const minuteColorElem = document.getElementById(`minuteColor-${index}`);

            hourColorElem.style.backgroundColor = data.hourColor.startsWith('#') ? data.hourColor : `#${data.hourColor}`;
            hourColorElem.style.color = 'black';
            hourColorElem.innerText = data.hourColor;

            minuteColorElem.style.backgroundColor = data.minuteColor.startsWith('#') ? data.minuteColor : `#${data.minuteColor}`;
            minuteColorElem.style.color = 'black';
            minuteColorElem.innerText = data.minuteColor;
          }
        });
      });
    }

    function updateDebugTablePeriodically() {
      setInterval(() => {
        updateTable();  // Call the function to update the table every 10 seconds
      }, 10000);  // Every 10 seconds
    }

    window.onload = function () {
      updateTable();
      updateDebugTablePeriodically();  // Start the periodic update for debug table
    }
  </script>
</body>

</html>
